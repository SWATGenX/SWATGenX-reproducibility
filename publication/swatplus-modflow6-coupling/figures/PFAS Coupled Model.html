document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.hasTag }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"{{ node.tagStyle }}\">{{ node.tag }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n\n  <sc-for list=\"{{ labels }}\" as=\"lbl\" hint-placeholder-count=\"2\">\n    <div style=\"{{ lbl.style }}\">{{ lbl.text }}<\u002Fdiv>\n  <\u002Fsc-for>\n\n  <div style=\"position:absolute;left:0;top:0;width:1680px;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-bottom:1px solid #DEDCD3;background:#EFEEE9;z-index:5;\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;max-width:880px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;color:#2C6E63;\">ADDED IN THIS WORK<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.42;color:#3E4A47;\"><b style=\"color:#5B4D29;font-weight:600;\">①<\u002Fb> process-based PFAS engine <b style=\"color:#5B4D29;font-weight:600;\">ported to SWAT+<\u002Fb> (rigorous 3-phase, incl. air–water interface) &nbsp;·&nbsp; <b style=\"color:#355E57;font-weight:600;\">②<\u002Fb> PFAS groundwater transport via <b style=\"color:#355E57;font-weight:600;\">MODFLOW 6 GWT<\u002Fb> (replacing RT3D) &nbsp;·&nbsp; <b style=\"color:#2C6E63;font-weight:600;\">③<\u002Fb> first two-way <b style=\"color:#2C6E63;font-weight:600;\">SWAT+ ↔ MODFLOW 6<\u002Fb> coupling.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"display:flex;align-items:center;gap:9px;\"><div style=\"width:28px;height:17px;background:#E4D8BC;border:1px solid #C3AE7E;transform:skewX(-15deg);\"><\u002Fdiv><span style=\"font-size:15px;color:#5B4D29;font-style:italic;\">Inputs<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;\"><div style=\"width:28px;height:17px;background:#E2E6E4;border:1px solid #C3CCC8;border-radius:3px;\"><\u002Fdiv><span style=\"font-size:15px;color:#3E4A47;\">Outputs / fluxes<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;\"><div style=\"width:19px;height:19px;background:#AFC3C9;border:1px solid #7E9AA1;border-radius:50%;\"><\u002Fdiv><span style=\"font-size:15px;color:#21323E;\">Model processes<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;\"><div style=\"width:28px;height:17px;background:#EEF4F2;border:2px solid #2C6E63;border-radius:3px;\"><\u002Fdiv><span style=\"font-size:15px;color:#2C6E63;font-weight:600;\">Added in this work<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1680,&quot;height&quot;:1080}}\">\nclass Component extends DCLogic {\n  state = { hover: null };\n\n  nodesDef() {\n    return [\n      {id:'biosolids', shape:'par', cx:172, cy:196, w:224, h:58, kind:'input', title:'Biosolids application'},\n      {id:'pfasSites', shape:'par', cx:172, cy:300, w:224, h:74, kind:'input', title:'PFAS sites & Background PFAS'},\n      {id:'wwtp', shape:'par', cx:172, cy:840, w:208, h:58, kind:'input', title:'WWTP effluents'},\n      {id:'aquifer', shape:'par', cx:1500, cy:470, w:232, h:78, kind:'input', added:true, title:'Aquifer & depth-to-water (kriged)'},\n      {id:'legacy', shape:'par', cx:1556, cy:726, w:190, h:80, kind:'input', added:true, title:'Legacy / point source (measured plume)'},\n      {id:'soilProfile', shape:'circle', cx:558, cy:240, r:70, kind:'process', added:true, title:'PFAS fate in soil profile'},\n      {id:'surfHydro', shape:'circle', cx:858, cy:240, r:64, kind:'process', title:'Surface hydrology', tag:'SWAT+', fs:14},\n      {id:'erosion', shape:'circle', cx:172, cy:556, r:60, kind:'process', title:'Soil erosion cycle', tag:'SWAT+', fs:14},\n      {id:'stream', shape:'circle', cx:558, cy:862, r:86, kind:'process', title:'PFAS fate & transport in stream & lakes', fs:16},\n      {id:'gwFlow', shape:'circle', cx:1320, cy:240, r:72, kind:'process', added:true, title:'Groundwater flow', tag:'MODFLOW 6'},\n      {id:'gwTransport', shape:'circle', cx:1330, cy:726, r:78, kind:'process', added:true, title:'Groundwater transport', tag:'MODFLOW 6'},\n      {id:'waterSolid', shape:'rect', cx:366, cy:432, w:184, h:90, kind:'output', title:'Adsorbed at water\\u2013solid interface'},\n      {id:'airWater', shape:'rect', cx:558, cy:432, w:184, h:90, kind:'output', title:'Adsorbed at air\\u2013water interface', tag:'reversible \\u21C4 aqueous'},\n      {id:'aqueous', shape:'rect', cx:750, cy:432, w:184, h:82, kind:'output', title:'PFAS in aqueous phase'},\n      {id:'sediment', shape:'rect', cx:366, cy:632, w:176, h:80, kind:'output', title:'PFAS transport with sediment'},\n      {id:'runoff', shape:'rect', cx:558, cy:632, w:176, h:80, kind:'output', title:'PFAS transport with runoff'},\n      {id:'lateral', shape:'rect', cx:750, cy:632, w:176, h:80, kind:'output', title:'PFAS transport with lateral flow'},\n      {id:'leaching', shape:'rect', cx:934, cy:632, w:156, h:80, kind:'output', title:'PFAS transport with leaching'},\n      {id:'vadose', shape:'rect', cx:1122, cy:632, w:172, h:86, kind:'output', added:true, title:'PFAS transport through vadose zone'},\n      {id:'discharge', shape:'rect', cx:558, cy:1006, w:200, h:70, kind:'output', title:'PFAS discharge to downstream'},\n    ];\n  }\n\n  edgesDef() {\n    return [\n      ['biosolids','soilProfile'],['pfasSites','soilProfile'],['surfHydro','soilProfile'],\n      ['soilProfile','waterSolid'],['soilProfile','airWater'],['soilProfile','aqueous'],\n      ['waterSolid','erosion',{elbow:'wsErosion'}],['erosion','sediment',{elbow:'erosionSed'}],\n      ['aqueous','runoff'],['aqueous','lateral'],['aqueous','leaching'],\n      ['sediment','stream'],['runoff','stream'],['lateral','stream'],['wwtp','stream'],\n      ['stream','discharge'],\n      ['leaching','vadose',{k:'a',dashed:true,label:'decadal lag (retardation)',lx:1024,ly:694}],['vadose','gwTransport',{k:'a',dashed:true}],\n      ['aquifer','gwFlow',{k:'a',elbow:'aquiferGw'}],['gwFlow','gwTransport',{k:'a'}],\n      ['legacy','gwTransport',{k:'a'}],\n      ['pfasSites','legacy',{elbow:'sitesToLegacy',dashed:true,label:'PFAS sites also seed the legacy GW plume',lx:780,ly:1052}],\n      ['surfHydro','gwFlow',{k:'a',elbow:'recharge',label:'\\u2462 recharge (surface\\u2192GW)',lx:1085,ly:209}],\n      ['gwFlow','surfHydro',{k:'a',elbow:'baseflow',label:'baseflow (GW\\u2192surface water)',lx:1085,ly:301}],\n      ['gwTransport','stream',{k:'a',elbow:'discharge',label:'groundwater PFAS discharge to stream',lx:940,ly:846}],\n    ];\n  }\n\n  anchor(n, tx, ty) {\n    const dx = tx - n.cx, dy = ty - n.cy;\n    if (n.shape === 'circle') {\n      const L = Math.hypot(dx, dy) || 1;\n      return { x: n.cx + dx / L * n.r, y: n.cy + dy / L * n.r };\n    }\n    const hw = n.w / 2, hh = n.h / 2;\n    const sx = Math.abs(dx) > 1e-6 ? hw / Math.abs(dx) : 1e9;\n    const sy = Math.abs(dy) > 1e-6 ? hh / Math.abs(dy) : 1e9;\n    const t = Math.min(sx, sy);\n    return { x: n.cx + dx * t, y: n.cy + dy * t };\n  }\n\n  buildPath(a, b, curve) {\n    const f = (v) => v.toFixed(1);\n    if (!curve) return `M ${f(a.x)} ${f(a.y)} L ${f(b.x)} ${f(b.y)}`;\n    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;\n    const cy = curve === 'up' ? my - 72 : my + 54;\n    return `M ${f(a.x)} ${f(a.y)} Q ${f(mx)} ${f(cy)} ${f(b.x)} ${f(b.y)}`;\n  }\n\n  elbowPath(pts, r) {\n    const f = (v) => Math.round(v * 10) / 10;\n    if (pts.length < 3) return `M ${f(pts[0][0])} ${f(pts[0][1])} L ${f(pts[1][0])} ${f(pts[1][1])}`;\n    let d = `M ${f(pts[0][0])} ${f(pts[0][1])}`;\n    for (let i = 1; i < pts.length - 1; i++) {\n      const p0 = pts[i-1], p1 = pts[i], p2 = pts[i+1];\n      const v1x = p1[0]-p0[0], v1y = p1[1]-p0[1]; const l1 = Math.hypot(v1x, v1y) || 1;\n      const v2x = p2[0]-p1[0], v2y = p2[1]-p1[1]; const l2 = Math.hypot(v2x, v2y) || 1;\n      const rr = Math.min(r, l1/2, l2/2);\n      const ax = p1[0]-v1x/l1*rr, ay = p1[1]-v1y/l1*rr;\n      const bx = p1[0]+v2x/l2*rr, by = p1[1]+v2y/l2*rr;\n      d += ` L ${f(ax)} ${f(ay)} Q ${f(p1[0])} ${f(p1[1])} ${f(bx)} ${f(by)}`;\n    }\n    const last = pts[pts.length-1];\n    d += ` L ${f(last[0])} ${f(last[1])}`;\n    return d;\n  }\n\n  renderVals() {\n    const accent = '#2C6E63', slate = '#34474A';\n    const C = {\n      input:   { bg:'#E4D8BC', bd:'#C3AE7E', tx:'#5B4D29' },\n      output:  { bg:'#E2E6E4', bd:'#C3CCC8', tx:'#3E4A47' },\n      process: { bg:'#AFC3C9', bd:'#7E9AA1', tx:'#243A3D' },\n    };\n    const defs = this.nodesDef();\n    const M = {}; defs.forEach(n => M[n.id] = n);\n    const edef = this.edgesDef();\n    const hover = this.state.hover;\n\n    const nb = new Set();\n    if (hover) edef.forEach(e => { if (e[0] === hover) nb.add(e[1]); if (e[1] === hover) nb.add(e[0]); });\n\n    const setHover = (id) => () => this.setState({ hover: id });\n    const clearHover = () => this.setState({ hover: null });\n\n    const nodes = defs.map(n => {\n      const col = C[n.kind];\n      const isC = n.shape === 'circle';\n      const w = isC ? 2 * n.r : n.w, h = isC ? 2 * n.r : n.h;\n      const active = !hover || n.id === hover || nb.has(n.id);\n      const outerStyle = {\n        position:'absolute', left:(n.cx - w/2)+'px', top:(n.cy - h/2)+'px', width:w+'px', height:h+'px',\n        display:'flex', alignItems:'center', justifyContent:'center', boxSizing:'border-box',\n        background: col.bg,\n        border: n.added ? ('2.5px solid ' + accent) : ('1.5px solid ' + col.bd),\n        borderRadius: isC ? '50%' : (n.shape === 'rect' ? '8px' : '3px'),\n        transform: n.shape === 'par' ? 'skewX(-15deg)' : 'none',\n        boxShadow: n.added ? '0 0 0 5px rgba(44,110,99,0.10)' : 'none',\n        opacity: active ? 1 : 0.28,\n        transition: 'opacity .2s ease, box-shadow .2s ease', zIndex:3, cursor:'default',\n      };\n      const innerStyle = {\n        transform: n.shape === 'par' ? 'skewX(15deg)' : 'none',\n        maxWidth: (isC ? (2*n.r - 24) : (n.w - 22)) + 'px',\n        textAlign:'center', color: col.tx,\n        fontFamily:\"'Hanken Grotesk',system-ui,sans-serif\",\n        fontSize:(n.fs || 15)+'px', fontWeight: n.kind === 'process' ? 600 : 500,\n        fontStyle: n.kind === 'input' ? 'italic' : 'normal',\n        lineHeight:1.16, letterSpacing:'.1px',\n        display:'flex', flexDirection:'column', alignItems:'center', gap:'2px',\n        padding: isC ? '4px' : '4px 6px',\n      };\n      const tagStyle = {\n        fontFamily:\"'JetBrains Mono',monospace\", fontSize:'12px', fontWeight:500, fontStyle:'normal',\n        letterSpacing:'0', color: n.added ? accent : '#5E7286', marginTop:'1px',\n      };\n      return { id:n.id, outerStyle, innerStyle, tagStyle, title:n.title, tag:n.tag || '', hasTag: !!n.tag, onEnter:setHover(n.id), onLeave:clearHover };\n    });\n\n    const edges = edef.map((e, i) => {\n      const A = M[e[0]], B = M[e[1]]; const o = e[2] || {};\n      const k = o.k === 'a' ? 'a' : 'n';\n      const active = !hover || e[0] === hover || e[1] === hover;\n      let d;\n      if (o.elbow === 'recharge') {\n        d = `M ${A.cx + A.r} ${A.cy - 11} L ${B.cx - B.r} ${B.cy - 11}`;\n      } else if (o.elbow === 'baseflow') {\n        d = `M ${A.cx - A.r} ${A.cy + 11} L ${B.cx + B.r} ${B.cy + 11}`;\n      } else if (o.elbow === 'aquiferGw') {\n        const s = [A.cx, A.cy - A.h/2], en = [B.cx + B.r, B.cy];\n        d = this.elbowPath([s, [s[0], en[1]], en], 16);\n      } else if (o.elbow === 'sitesToLegacy') {\n        const s = [A.cx - A.w/2, A.cy], en = [B.cx, B.cy + B.h/2];\n        d = this.elbowPath([s, [38, A.cy], [38, 1052], [en[0], 1052], en], 16);\n      } else if (o.elbow === 'discharge') {\n        const s = [A.cx, A.cy + A.r], en = [B.cx + B.r, B.cy];\n        d = this.elbowPath([s, [s[0], en[1]], en], 16);\n      } else if (o.elbow === 'wsErosion') {\n        const s = [A.cx, A.cy + A.h/2], en = [B.cx + B.r, B.cy];\n        d = this.elbowPath([s, [s[0], en[1]], en], 14);\n      } else if (o.elbow === 'erosionSed') {\n        const s = [A.cx, A.cy + A.r], en = [B.cx - B.w/2, B.cy];\n        d = this.elbowPath([s, [s[0], en[1]], en], 14);\n      } else {\n        const a = this.anchor(A, B.cx, B.cy), b = this.anchor(B, A.cx, A.cy);\n        d = this.buildPath(a, b, o.curve);\n      }\n      const stroke = k === 'a' ? accent : slate;\n      const mk = 'url(#' + (k === 'a' ? 'arrowAccent' : 'arrowSlate') + ')';\n      const pathStyle = {\n        fill:'none', stroke, strokeWidth:(k === 'a' ? 3 : 2.6)+'px', strokeLinecap:'round', strokeLinejoin:'round',\n        markerEnd: mk, markerStart: o.bidir ? mk : 'none',\n        strokeDasharray: o.dashed ? '8 7' : 'none',\n        opacity: active ? (o.elbow === 'sitesToLegacy' ? 0.5 : (k === 'a' ? 1 : 0.92)) : 0.12, transition:'opacity .2s ease',\n      };\n      return { id:'e'+i, d, pathStyle };\n    });\n\n    const labels = edef.filter(e => e[2] && e[2].label).map((e, i) => {\n      const o = e[2]; const active = !hover || e[0] === hover || e[1] === hover;\n      const style = {\n        position:'absolute', left:o.lx+'px', top:o.ly+'px', transform:'translate(-50%,-50%)',\n        fontFamily:\"'JetBrains Mono',monospace\", fontSize:'15px', fontStyle:'italic', fontWeight:500,\n        color:accent, background:'rgba(243,241,235,0.82)', padding:'2px 8px', borderRadius:'4px',\n        whiteSpace:'nowrap', lineHeight:1.3, textAlign:'center', zIndex:4, pointerEvents:'none',\n        opacity: active ? 1 : 0.12, transition:'opacity .2s ease',\n      };\n      return { id:'l'+i, text:o.label, style };\n    });\n\n    return { nodes, edges, labels };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
